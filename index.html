<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>A Royal Bloom For You 🌸💍</title>
  
  <!-- MediaPipe Hand Tracking Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #090e18; /* Deep elegant dark blue/black */
      color: white;
      font-family: 'Playfair Display', serif; /* Use a sophisticated font (Google Fonts) */
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* 1. The High-Definition HD Tulip Layer */
    #hd-tulip-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      /* Replace this with a direct URL to a real, beautiful, free-to-use tulip photo */
      /* Or put your own `tulip_field.jpg` in the folder and use `background-image: url('tulip_field.jpg');` */
      background-image: url('https://images.unsplash.com/photo-1541623862657-3a6d47d4e5f0?q=80&w=1920&auto=format&fit=crop'); /* Stunning free tulip photo */
      background-size: cover;
      background-position: center bottom; /* Anchor tulips at bottom of screen */
      z-index: 1; /* Lowest layer */
      transition: filter 0.1s linear; /* Smooth filter transitions */
      filter: blur(10px) saturate(0) brightness(0.4); /* Default State: Blur, Grayscale, Dark */
    }

    /* 2. Overlays and UI */
    .interface-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10; /* Highest layer for text/buttons */
      pointer-events: none; /* Let clicks pass through except to the button */
    }

    /* HUD for bloom percent (Optional) */
    #hud {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 300;
      backdrop-filter: blur(4px);
    }

    /* The Main Message Text */
    #main-message {
      text-align: center;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      margin-top: 5vh; /* Push message lower */
    }

    #main-message h1 {
      font-size: 2.2rem;
      margin: 0 0 10px 0;
      color: #ffd700; /* Gold */
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }

    #main-message p {
      font-size: 1.1rem;
      margin: 0;
      color: #fce7f3; /* Very pale pink */
    }

    /* The Tiara Image */
    #princess-tiara {
      width: 120px;
      height: auto;
      margin-bottom: 20px;
      opacity: 0;
      transition: opacity 2s ease-in-out;
      filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.9));
    }

    /* Start Button Overlay */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 14, 24, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100; /* Always on top initially */
      backdrop-filter: blur(10px);
      pointer-events: auto; /* Required for the button */
    }

    #start-btn {
      background: linear-gradient(135deg, #ec4899, #db2777);
      color: white;
      border: none;
      padding: 18px 36px;
      font-size: 1.2rem;
      font-family: inherit;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(236, 72, 153, 0.5);
      transition: all 0.3s ease;
    }

    #start-btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 15px 40px rgba(236, 72, 153, 0.6);
    }

    /* Required for video element to be present but hidden */
    video { display: none; }

  </style>
</head>
<body>

  <!-- The HD Background Tulip Layer -->
  <div id="hd-tulip-bg"></div>

  <!-- The Audio Element -->
  <audio id="bg-music" loop>
    <!-- Use your local file name here -->
    <source src="golden_brown_slowed.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Content Interface -->
  <div class="interface-layer">
    <div id="hud">0%</div>

    <!-- Hidden message revealed on full bloom -->
    <img id="princess-tiara" src="princess_tiara.png" alt="Tiara" />
    <div id="main-message">
      <h1>For The Best Girlfriend In The World 🌸💍</h1>
      <p>Wishing you the happiest Girlfriend's Day, my princess.</p>
    </div>
  </div>

  <!-- Start Button Overlay -->
  <div id="start-overlay">
    <button id="start-btn">A Royal Bloom For You 🌸 (Click to Begin)</button>
    <video id="webcam" playsinline></video>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const hud = document.getElementById('hud');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const music = document.getElementById('bg-music');
    
    // The animated elements
    const tulipBg = document.getElementById('hd-tulip-bg');
    const tiara = document.getElementById('princess-tiara');
    const message = document.getElementById('main-message');

    let bloomFactor = 0;
    let bloomComplete = false;

    // Helper to calculate 2D distance
    function getDistance(p1, p2) {
      const dx = (p1.x - p2.x) * 640; // Approx canvas scale
      const dy = (p1.y - p2.y) * 480;
      return Math.sqrt(dx * dx + dy * dy);
    }

    // New Filter Animation Logic: Animates HD image filters
    function animateHdFilters(factor) {
      // Blur: 10px -> 0px
      const blurValue = (1 - factor) * 10;
      // Saturation: 0 (Grayscale) -> 2.0 (Vibrant Color)
      const saturationValue = 0.4 + (factor * 1.6); // Start partially saturated, go vivid
      // Brightness: 0.4 (Dark) -> 1.0 (Full Brightness)
      const brightnessValue = 0.4 + (factor * 0.6);
      // Contrast: Slightly increase contrast as it gets bright
      const contrastValue = 0.8 + (factor * 0.4);

      // Apply the dynamic CSS filters
      tulipBg.style.filter = `blur(${blurValue}px) saturate(${saturationValue}) brightness(${brightnessValue}) contrast(${contrastValue})`;
    }

    // MediaPipe Hand Detection Callback
    function onResults(results) {
      // Clear the main content while working
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];

        // Landmark 4 = Thumb Tip, Landmark 8 = Index Tip
        const thumbTip = landmarks[4];
        const indexTip = landmarks[8];

        const dist = getDistance(thumbTip, indexTip);
        
        // Map distance (~20px to 220px) to bloom factor 0.0 - 1.0
        const rawFactor = (dist - 20) / (200 - 20);
        bloomFactor = Math.min(Math.max(rawFactor, 0), 1);

        // Animate the background image filters
        animateHdFilters(bloomFactor);
        
        // Update HUD (Optional)
        const bloomPercent = Math.round(bloomFactor * 100);
        hud.innerText = `${bloomPercent}%`;

        // Check if bloom is complete to reveal message/tiara
        if (bloomFactor > 0.98 && !bloomComplete) {
          bloomComplete = true;
          // Use fade-in transitions
          tiara.style.opacity = 1;
          message.style.opacity = 1;
        } else if (bloomFactor < 0.9 && bloomComplete) {
          // Fade content back out if gesture is removed (keeps it dynamic)
          bloomComplete = false;
          tiara.style.opacity = 0;
          message.style.opacity = 0;
        }
      }
    }

    // Initialize MediaPipe Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults(onResults);

    // Initialize Camera Stream
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    // Handle the start-up: user click is REQUIRED for audio and camera
    startBtn.addEventListener('click', () => {
      // 1. Play Music immediately
      music.play()
        .then(() => { console.log("Music started"); })
        .catch(err => { console.error("Error starting music (likely file missing):", err); });
      
      // 2. Start Camera
      camera.start()
        .then(() => {
          // Hide overlay and start experiencing
          startOverlay.style.display = 'none';
        })
        .catch((err) => {
          console.error("Camera access denied or error:", err);
          alert("Camera access denied. For the full experience, please check browser permissions.");
        });
    });
  </script>
</body>
</html>
